name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests (LLM mocked, no API key)
        run: uv run pytest -q
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Build index
        run: uv run python -m rag.ingest --rebuild --no-smoke
      - name: Retrieval eval gate (hit@6 >= 0.80, deterministic, no API key)
        run: uv run python -m eval.run_eval --retrieval-only --min-hit 0.80 --no-write

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: maint-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and reports a loaded index
        run: |
          docker run -d --name app -p 7860:7860 -e APP_API_KEY=ci maint-rag:ci
          for i in $(seq 1 60); do curl -sf localhost:7860/health && exit 0; sleep 3; done
          docker logs app; exit 1
