# Local Prometheus + Grafana pointed at the LIVE service. Use scripts/scrape_prod.py, which writes
# .cache/prometheus.prod.yml first. Ports differ from docker-compose.yml so both can run together.
name: maint-rag-prod
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./.cache/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9091:9090"]
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/maint-rag.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
