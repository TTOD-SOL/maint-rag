# Local dev stack: app + Prometheus + Grafana.
#   cp .env.example .env   # set ANTHROPIC_API_KEY and APP_API_KEY
#   docker compose up --build
# App http://localhost:7860 | Prometheus http://localhost:9090 | Grafana http://localhost:3000
services:
  app:
    build: .
    image: maint-rag:local
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: INFO
      # pass-through from .env or your shell, so keys never live in this file
      ANTHROPIC_API_KEY:
      APP_API_KEY:
      LLM_MODEL:
      DEMO_DAILY_CAP:
    ports: ["7860:7860"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [app]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/maint-rag.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
