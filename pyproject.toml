[project]
name = "maint-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14.0",
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "fonttools>=4.69.0",
    "pdfplumber>=0.11.11",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "index", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF100"]
ignore = ["E501"]  # long lines are mostly prompt text; keep them readable as prose

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
